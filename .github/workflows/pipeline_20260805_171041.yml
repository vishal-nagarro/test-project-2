name: Build and Test Pipeline

on:
  push:
    branches:
      - nexops-pipeline-5b85d906-1b97-4929-9164-a42ec67d3eea
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: mvn -B verify

      - name: Upload WAR artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: war-artifact
          path: target/springMVCCalculator.war
          retention-days: 60

      - name: Upload JaCoCo coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-coverage-report
          path: target/site/jacoco/
          retention-days: 60
